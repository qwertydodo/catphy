pre-commit:
  parallel: true
  commands:
    typecheck:
      run: npm run typecheck
    lint:
      run: npm run lint

pre-push:
  commands:
    no-push-to-main:
      run: >
        bash -c "branch=$(git rev-parse --abbrev-ref HEAD);
        if [ \"$branch\" = \"main\" ] || [ \"$branch\" = \"master\" ];
        then echo 'ERROR: Direct push to main/master is not allowed. Open a PR instead.'; exit 1; fi"
